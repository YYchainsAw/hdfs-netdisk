spring:
  config:
    import: configtree:/etc/netdisk/secrets/
  datasource:
    url: ${NETDISK_DB_URL:jdbc:mysql://127.0.0.1:13306/netdisk?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${NETDISK_DB_USERNAME:netdisk_app}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
